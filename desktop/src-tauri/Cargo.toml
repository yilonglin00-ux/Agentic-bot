[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
libc = "0.2"
tokio = { version = "1", features = ["time"] }
# tray-icon: die Menueleiste ist der einzige Weg zurueck, wenn Noki
# verborgen ist (Abschnitt 16). Kein Bilddecoder noetig — das Symbol wird
# in lib.rs als RGBA gerechnet, damit keine weitere Abhaengigkeit dazukommt.
# macos-private-api: Voraussetzung fuer ein durchsichtiges Fenster unter
# macOS. Sie muss zur Angabe macOSPrivateApi in tauri.conf.json passen —
# der Build prueft das. Bekannte Folge: eine App mit dieser Angabe ist
# nicht App-Store-faehig. Fuer einen lokalen Begleiter ist das der Preis
# fuer ein rahmenloses Panel statt eines grauen Fensterkastens.
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"

encoding_rs = "0.8"
dunce = "1"
# Native Mitteilung "Deine Antwort ist fertig" (UserNotifications, ohne weiteres Plugin)
objc2 = "0.6"
block2 = "0.6"
