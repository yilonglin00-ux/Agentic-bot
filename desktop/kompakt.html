<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Noki</title>
<script src="noki-oberflaeche.js"></script>
<!-- Kompakte Noki-Uebersicht: eigenes natives Fenster (^/° doppelt). Ein Launcher, kein Shortcut-Spickzettel:
     jede Kachel/Zeile loest exakt die bestehende Aktion aus (kompakt_aktion n; 10 = Einstellungen). -->
<style>
  :root { color-scheme: dark; --akzent: var(--noki-accent); --akzent-bg: rgba(var(--noki-accent-rgb), 0.16); --linie: var(--noki-border); --text2: var(--noki-text-secondary); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--noki-bg); color: var(--noki-text);
    font: 450 13px/1.35 var(--noki-ui-font);
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; }
  .kopf { height: 34px; }                      /* Platz fuer die nativen Ampel-Knoepfe */
  header { padding: 0 22px 10px; }
  h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.015em; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--text2); }
  main { padding: 0 14px 10px; display: flex; flex-direction: column; gap: 12px; }
  button { all: unset; box-sizing: border-box; cursor: pointer; transition: background 110ms ease, border-color 110ms ease; }
  button:focus-visible { outline: 2px solid rgba(214, 206, 176, 0.55); outline-offset: 1px; }
  .ask { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 15px; border-radius: 12px; background: var(--akzent-bg); border: 1px solid rgba(214, 206, 176, 0.3); }
  .ask:hover { background: rgba(214, 206, 176, 0.24); }
  .ask:active { background: rgba(214, 206, 176, 0.3); }
  .ask .punkt { width: 9px; height: 9px; border-radius: 50%; background: var(--akzent); flex: none; }
  .ask strong { display: block; font-size: 14.5px; font-weight: 650; color: var(--noki-text); }
  .ask small { display: block; margin-top: 1px; font-size: 11.5px; color: var(--noki-text-secondary); }
  .gruppe h2 { margin: 0 6px 7px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--text2); }
  .kacheln { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .kacheln.zwei { grid-template-columns: repeat(2, 1fr); }
  .kachel { display: flex; flex-direction: column; justify-content: space-between; gap: 8px; min-height: 56px; padding: 9px 11px 9px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.045); border: 1px solid rgba(255, 255, 255, 0.06); }
  .kachel:hover { background: rgba(255, 255, 255, 0.085); }
  .kachel:active { background: rgba(255, 255, 255, 0.13); }
  .kachel svg { color: rgba(235, 235, 230, 0.72); }
  .kachel span { display: block; font-size: 12.5px; font-weight: 580; }
  .kachel small { display: block; margin-top: 1px; font-size: 10.5px; color: var(--text2); }
  .zeilen { display: flex; flex-direction: column; }
  .zeile { display: flex; align-items: center; gap: 11px; width: 100%; height: 31px; padding: 0 10px; border-radius: 8px; }
  .zeile:hover { background: rgba(255, 255, 255, 0.07); }
  .zeile:active { background: rgba(255, 255, 255, 0.13); }
  .zeile svg { flex: none; color: rgba(235, 235, 230, 0.62); }
  .zeile .t { flex: 1; font-weight: 560; }
  .zeile small { font-size: 11px; color: var(--text2); }
  .an { border-color: rgba(214, 206, 176, 0.45) !important; }
  .an small { color: var(--akzent); }
  .rec.an { border-color: rgba(229, 83, 75, 0.55) !important; }
  .rec.an small { color: #ef8a83; }
  footer { margin: 0 14px; padding: 6px 0 10px; border-top: 1px solid var(--linie); }
  footer .t { font-weight: 520; color: rgba(235, 235, 230, 0.85); }
</style>
</head>
<body>
<div class="kopf" data-tauri-drag-region></div>
<header data-tauri-drag-region><h1>Noki</h1><p>Was möchtest du tun?</p></header>
<main id="liste"></main>
<footer id="fuss"></footer>
<script>
  var T = window.__TAURI__, inv = T.core.invoke;
  var Z = { rec: false, frz: false, timer: false, fokus: false, ablage: 0 };
  var S = ' width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">';
  var I = {
    foto: '<svg' + S + '<path d="M2 5.5h2.5L6 3.5h4l1.5 2H14v7H2z"/><circle cx="8" cy="9" r="2.3"/></svg>',
    rec: '<svg' + S + '<circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2.3" fill="currentColor" stroke="none"/></svg>',
    frz: '<svg' + S + '<path d="M8 2v12M2.8 5l10.4 6M13.2 5L2.8 11"/></svg>',
    fenster: '<svg' + S + '<rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M6.3 6.8l3.4 3.4M9.7 6.8l-3.4 3.4"/></svg>',
    ablage: '<svg' + S + '<path d="M2.5 9.5l1.8-5.5h7.4l1.8 5.5V13h-11z"/><path d="M2.5 9.5h3.2l.8 1.5h3l.8-1.5h3.2"/></svg>',
    clip: '<svg' + S + '<rect x="3.5" y="3" width="9" height="11" rx="1.5"/><path d="M6 3V2h4v1M6 7h4M6 9.5h4"/></svg>',
    timer: '<svg' + S + '<circle cx="8" cy="9" r="5"/><path d="M8 9V6.3M6.5 2h3"/></svg>',
    platz: '<svg' + S + '<rect x="2" y="3" width="5" height="10" rx="1"/><rect x="9" y="3" width="5" height="4.5" rx="1"/><rect x="9" y="9.5" width="5" height="3.5" rx="1"/></svg>',
    einst: '<svg' + S + '<path d="M3 4.5h10M3 8h10M3 11.5h10"/><circle cx="6" cy="4.5" r="1.4" fill="#1c1d1f"/><circle cx="10.5" cy="8" r="1.4" fill="#1c1d1f"/><circle cx="5" cy="11.5" r="1.4" fill="#1c1d1f"/></svg>'
  };
  function kachel(n, icon, t, sub, an, extra) {
    return '<button class="kachel' + (an ? ' an' : '') + (extra || '') + '" data-n="' + n + '">' + icon + '<span>' + t + (sub ? '<small>' + sub + '</small>' : '') + '</span></button>';
  }
  function zeile(n, icon, t, sub) { return '<button class="zeile" data-n="' + n + '">' + icon + '<span class="t">' + t + '</span>' + (sub ? '<small>' + sub + '</small>' : '') + '</button>'; }
  function bauen() {
    document.getElementById("liste").innerHTML =
      '<button class="ask" data-n="0"><span class="punkt"></span><span><strong>Ask Noki</strong><small>Lokal fragen · privat</small></span></button>'
      + '<section class="gruppe"><h2>Festhalten</h2><div class="kacheln">'
      + kachel(1, I.foto, "Foto", "", false)
      + kachel(2, I.rec, Z.rec ? "Aufnahme" : "Aufnahme", Z.rec ? "läuft · stoppen" : "", Z.rec, " rec")
      + kachel(3, I.frz, "Freeze", Z.frz ? "aktiv · beenden" : "", Z.frz) + '</div></section>'
      + '<section class="gruppe"><h2>Ordnen</h2><div class="zeilen">'
      + zeile(4, I.fenster, "Nokis Büro", "")
      + zeile(5, I.ablage, "Dokumente", Z.ablage ? Z.ablage + (Z.ablage === 1 ? " Datei" : " Dateien") : "")
      + zeile(6, I.clip, "Zwischenablage", "") + '</div></section>'
      + '<section class="gruppe"><h2>Arbeiten</h2><div class="kacheln zwei">'
      + kachel(7, I.timer, "Timer", Z.timer ? "läuft" : "", Z.timer)
      + kachel(8, I.platz, "Arbeitsplatz-Fokus", Z.fokus ? "aktiv" : "", Z.fokus) + '</div></section>';
    document.getElementById("fuss").innerHTML = zeile("e", I.einst, "Einstellungen", "");
  }
  // Die native Seite schliesst dieses Fenster und loest DANACH die Aktion aus (10 = Einstellungen, 0 = Ask Noki).
  function ausloesen(n) { inv("kompakt_aktion", { n: n === "e" ? 10 : +n }); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-n]") : null;
    if (b) ausloesen(b.getAttribute("data-n"));
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { inv("kompakt_zu"); return; }
    if (/^[0-8]$/.test(e.key) && !e.metaKey && !e.ctrlKey) ausloesen(e.key);   // Tastatur funktioniert weiter, ohne Zahlen im Bild
    if (e.key === "," && e.metaKey) { e.preventDefault(); ausloesen("e"); }
  });
  T.event.listen("noki://kompakt_zustand", function (ev) { Z = ev.payload || Z; bauen(); });
  bauen();
  T.event.emit("noki://kompakt_frage", {});
</script>
</body>
</html>
